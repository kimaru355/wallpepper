# Serves https://wallpepper.pcstack.top/downloads/ (release binaries + latest.json) from the node's
# /srv/wallpepper-downloads (see scripts/publish.sh). The site itself is built by the VPS dashboard from GitHub;
# this pod exists because the dashboard can't mount host folders. Traefik prefers this longer /downloads prefix
# over the site's "/". Apply with scripts/deploy-downloads.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wallpepper-downloads-nginx
  namespace: wallpepper
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      sendfile on;
      tcp_nopush on;
      add_header X-Content-Type-Options "nosniff" always;
      location /downloads/ {
        alias /downloads/;
        autoindex off;
        default_type application/octet-stream;   # .AppImage has no registered type
        # the version is in the file name, so a given URL never changes
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
      }
      location = /downloads/latest.json {
        alias /downloads/latest.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallpepper-downloads
  namespace: wallpepper
  labels: { app.kubernetes.io/name: wallpepper-downloads }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: wallpepper-downloads }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wallpepper-downloads }
    spec:
      enableServiceLinks: false
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /downloads/latest.json, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 101
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: downloads, mountPath: /downloads, readOnly: true }
            - { name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
      volumes:
        - name: downloads
          hostPath: { path: /srv/wallpepper-downloads, type: DirectoryOrCreate }
        - name: conf
          configMap: { name: wallpepper-downloads-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: wallpepper-downloads
  namespace: wallpepper
spec:
  selector: { app.kubernetes.io/name: wallpepper-downloads }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wallpepper-downloads
  namespace: wallpepper
spec:
  ingressClassName: traefik
  rules:
    - host: wallpepper.pcstack.top
      http:
        paths:
          - path: /downloads
            pathType: Prefix
            backend:
              service: { name: wallpepper-downloads, port: { name: http } }
  tls:
    - hosts: [wallpepper.pcstack.top]
      secretName: wallpepper-backend-tls
