server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  sendfile on;
  tcp_nopush on;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # NOTE: add_header inside a location replaces these, so each location repeats the security headers.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;

  # Release files live on the node (hostPath mounted at /downloads) so a release never needs a new site image.
  location /downloads/ {
    alias /downloads/;
    autoindex off;
    default_type application/octet-stream;   # .AppImage has no registered type
    # the version is in the file name, so a given URL never changes
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
  }
  location = /downloads/latest.json {
    alias /downloads/latest.json;
    default_type application/json;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
  }
}
